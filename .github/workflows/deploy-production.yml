name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SITE_URL: https://savannaexplorer.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GSC_VERIFICATION: ${{ secrets.VITE_GSC_VERIFICATION }}
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          echo "${DEPLOY_HOST} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO6dMEVBHX3GAnyQVN3aKPCBLB1unfoDUeExlBApadCv" >> "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host deploy-host
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ${HOME}/.ssh/deploy_key
            ConnectTimeout 45
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
          EOF
          sed -i 's/^[[:space:]]*//' "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Backup current site on server
        continue-on-error: true
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          attempt=0
          max=5
          while [ "$attempt" -lt "$max" ]; do
            attempt=$((attempt + 1))
            if ssh -F "$HOME/.ssh/config" deploy-host \
              "test -d '${DEPLOY_PATH}' && cp -a '${DEPLOY_PATH}' '${DEPLOY_PATH}_backup_$(date +%Y%m%d_%H%M%S)' || mkdir -p '${DEPLOY_PATH}'"; then
              exit 0
            fi
            echo "SSH backup attempt ${attempt}/${max} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "Backup skipped after ${max} attempts — continuing to upload."
          exit 0

      - name: Upload build to Hostinger
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          attempt=0
          max=5
          while [ "$attempt" -lt "$max" ]; do
            attempt=$((attempt + 1))
            if rsync -avz --delete \
              -e "ssh -F ${HOME}/.ssh/config" \
              dist/ \
              "deploy-host:${DEPLOY_PATH}/"; then
              exit 0
            fi
            echo "Rsync attempt ${attempt}/${max} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "Upload failed after ${max} attempts."
          exit 1

      - name: Verify deployment
        run: |
          VERSION=$(node -p "require('./package.json').version")
          curl -fsSL "https://savannaexplorer.com/" | grep -q 'Plan trip'
          curl -fsSL "https://savannaexplorer.com/" | grep -q 'Travel tools'
          curl -fsSL "https://savannaexplorer.com/sitemap.xml" | grep -q 'stays/sanparks'
          JS=$(curl -fsSL "https://savannaexplorer.com/" | grep -oE 'assets/index-[^"]+\.js' | head -1)
          curl -fsSL "https://savannaexplorer.com/${JS}" | grep -q "${VERSION}"
          echo "Production verified at v${VERSION} (${JS})."
