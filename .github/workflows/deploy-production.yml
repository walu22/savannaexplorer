name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SITE_URL: https://savannaexplorer.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GSC_VERIFICATION: ${{ secrets.VITE_GSC_VERIFICATION }}
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy dist --prod --token "$VERCEL_TOKEN" --yes

      - name: Verify deployment
        run: |
          VERSION=$(node -p "require('./package.json').version")
          curl -fsSL "https://savannaexplorer.com/" | grep -q 'Book Direct'
          curl -fsSL "https://savannaexplorer.com/sitemap.xml" | grep -q 'stays/sanparks'
          JS=$(curl -fsSL "https://savannaexplorer.com/" | grep -oE 'assets/index-[^"]+\.js' | head -1)
          curl -fsSL "https://savannaexplorer.com/${JS}" | grep -q "${VERSION}"
          echo "Production verified at v${VERSION} (${JS})."
