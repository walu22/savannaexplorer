name: Verify Vercel release

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: verify-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run visual and accessibility tests
        run: npm run test:e2e

      - name: Build production site
        env:
          VITE_SITE_URL: https://savannaexplorer.com
        run: npm run build
