# Savanna Explorer — nginx site block (Hostinger VPS)
# Place under /etc/nginx/conf.d/ or sites-enabled/, then: sudo nginx -t && sudo systemctl reload nginx
#
# Replace DEPLOY_PATH with your web root (often public_html for the domain).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name savannaexplorer.com www.savannaexplorer.com;

    # Hostinger usually manages these paths via hPanel — keep your existing ssl_certificate lines.
    # ssl_certificate     /path/from/hostinger/fullchain.pem;
    # ssl_certificate_key /path/from/hostinger/privkey.pem;

    root /var/www/savannaexplorer.com/public_html;
    index index.html;

    # Security headers (match or merge with your current config)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA routing — required for /countries/namibia etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets aggressively
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sitemap and robots
    location = /sitemap.xml {
        try_files $uri =404;
        default_type application/xml;
    }

    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name savannaexplorer.com www.savannaexplorer.com;
    return 301 https://$host$request_uri;
}
